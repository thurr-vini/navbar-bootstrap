<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar Responsiva -->  
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Sistema Escolar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class= "navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Cursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Formulário de Cadastro -->
    <div class="container mt-4">
        <h2>Cadastro de Aluno</h2>
        <form>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nome" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="exemplo@email.com">
                </div>
            </div>

            <!-- Linha 2: Senha e Data de Nascimento -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                    <input type="date" class="form-control" id="dataNascimento">
                </div>
            </div>

            <!-- Linha 3: Curso e Turno -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="curso" class="form-label">Curso</label>
                    <input type="text" class="form-control" id="curso" placeholder="Digite o nome do curso">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="cursoSelecionado" class="form-label">Curso</label>
                    <select class="form-select" id="cursoSelecionado">
                        <option value="">Selecione uma opção</option>
                        <option value="cc">Ciência da Computação</option>
                        <option value="seg">Segurança Cibernética</option>
                        <option value="gestao">Gestão Financeira</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Turno</label><br>
                    <div class="form-check form-check-inline mt-2">
                        <input class="form-check-input" type="radio" name="turno" id="manha" value="manha">
                        <label class="form-check-label" for="manha">Manhã</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="turno" id="tarde" value="tarde">
                        <label class="form-check-label" for="tarde">Tarde</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="turno" id="noite" value="noite">
                        <label class="form-check-label" for="noite">Noite</label>
                    </div>
                </div>
            </div>

            <!-- Botões -->
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                <button type="reset" class="btn btn-secondary">Limpar Campos</button>
            </div>
        </form>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
